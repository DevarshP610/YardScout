<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>YardScout iPhone preview</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px; padding: 24px; background: #171816; color: #f4f3ef; }
    .preview { display: grid; justify-items: center; gap: 12px; }
    .phone { width: min(390px, 88vw); height: min(844px, 78vh); padding: 12px; border: 8px solid #050505; border-radius: 42px; background: #050505; box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 30px; background: #f5f5f2; }
    p { margin: 0; color: #b2b2ad; text-align: center; }
    a { color: #f0b777; }
  </style>
</head>
<body>
  <main class="preview">
    <div class="phone" aria-label="YardScout iPhone preview">
      <iframe src="/" title="YardScout mobile experience"></iframe>
    </div>
    <p>Preview of the installable YardScout web app on an iPhone-sized screen. <a href="/">Open the app</a>.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A1206">
  <title>YardScout is offline</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f2; color: #1d1d1f; text-align: center; }
    main { max-width: 360px; }
    h1 { margin-bottom: 8px; font-size: 28px; }
    p { color: #6e6e73; line-height: 1.5; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #1a1206; color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>YardScout is offline</h1>
    <p>Your saved draft and cached listings remain on this device. Reconnect to refresh the map and listings.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>

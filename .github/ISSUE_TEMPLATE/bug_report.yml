name: Bug report
description: Report a reproducible problem in YardScout.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve YardScout. Please remove private data before posting.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the intended behavior.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the visible error or unexpected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, deployment, or commit
